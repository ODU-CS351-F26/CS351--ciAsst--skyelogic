plugins {
   id 'java'
   id 'application'
   id 'pmd'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(17)
    targetCompatibility = JavaVersion.toVersion(17)
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}

application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}



// ---------- Static analysis (PMD) ----------
// Analyze src/main/java only; never fail the build on PMD findings.

pmd {
    toolVersion = '7.7.0'
    ignoreFailures = true
    consoleOutput = false
    ruleSetFiles = files()
    ruleSets = ['category/java/bestpractices.xml',
                'category/java/errorprone.xml',
                'category/java/codestyle.xml']
}

tasks.named('pmdTest') { enabled = false }

tasks.withType(Pmd) {
    reports {
        xml.required = false
        html.required = true
    }
}

// ---------- Report generation ----------

// Copy our hand-written web content (index.md, etc.) into build/reports
tasks.register('copyHtml', Copy) {
    mustRunAfter 'test'
    from 'src/main/html'
    into 'build/reports'
}

// Copy the generated javadoc (build/docs/javadoc) into build/reports
tasks.register('copyDocs', Copy) {
    dependsOn 'javadoc'
    mustRunAfter 'test'
    from 'build/docs'
    into 'build/reports'
}

// Build, test, generate javadoc, then gather everything into build/reports
tasks.register('reports') {
    dependsOn 'build', 'javadoc', 'pmdMain', 'copyHtml', 'copyDocs'
}


// ---------- Deployment to GitHub Pages ----------

gitPublish {
    // the repository
       repoUri = 'https://github.com/ODU-CS351-F26/CS351--ciAsst--skyelogic.git'

    // branch in which to publish
    branch = 'gh-pages'

    // what to publish
    contents {
        from 'build/reports'
    }
}

// Make sure the reports exist before they are copied for publishing
tasks.named('gitPublishCopy') {
    dependsOn 'reports'
}

tasks.register('deployReports') {
    dependsOn 'reports', 'gitPublishPush'
}
