name: CI - build and test

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'adopt'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build and test
      run: ./gradlew build
    - name: Generate reports
      run: ./gradlew reports
    - name: Deploy reports to website
      run: ./gradlew deployReports
      env:
        GRGIT_USER: x-access-token
        GRGIT_PASS: ${{ secrets.GITHUB_TOKEN }}
